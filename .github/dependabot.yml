version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
        interval: "daily"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
        interval: "weekly"
    groups:
        cargo-minor-patch:
            update-types: ["minor", "patch"]
    ignore:
        # Majors (esp. solana-*) must move together; done manually.
        - dependency-name: "*"
          update-types: ["version-update:semver-major"]
